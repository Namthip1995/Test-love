<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Can I take you out? 💖</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    text-align: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

h1 {
    margin-top: 80px;
    color: white;
}

button {
    padding: 12px 25px;
    font-size: 16px;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    position: absolute;
    transition: 0.2s;
}

#yes {
    background: #ff4d6d;
    color: white;
    left: 40%;
    top: 50%;
}

#no {
    background: white;
    left: 55%;
    top: 50%;
}

#message {
    margin-top: 20px;
    color: white;
    font-size: 20px;
}

.heart {
    position: absolute;
    color: white;
    animation: fall 3s linear infinite;
}

@keyframes fall {
    0% { transform: translateY(-100px); opacity: 1; }
    100% { transform: translateY(100vh); opacity: 0; }
}
</style>
</head>

<body>

<h1>May i get to know you more?💕</h1>
<button id="yes">Yes 💘</button>
<button id="no">No 😝</button>

<div id="message"></div>

<script>
let noCount = 0;
const noBtn = document.getElementById("no");
const message = document.getElementById("message");

function handleNo() {
    noCount++;

    if (noCount === 1) {
        message.innerHTML = "Are you sure? 🥺";
    } 
    else if (noCount === 2) {
        message.innerHTML = "Think carefully... I’m really nice 😌";
    } 
    else {
        message.innerHTML = "Too late. You can’t press no anymore 😈";
noBtn.addEventListener("mouseover", moveButton);
        noBtn.addEventListener("click", function(e) {
            e.preventDefault();
            moveButton();
        });
    }
}

function moveButton() {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}
document.getElementById("no").addEventListener("click", handleNo);

document.getElementById("yes").addEventListener("click", function() {
    message.innerHTML = "I knew you'd say yes 💖";

    for (let i = 0; i < 25; i++) {
        let heart = document.createElement("div");
        heart.innerHTML = "💖";
        heart.className = "heart";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = Math.random() * 30 + 20 + "px";
        heart.style.animationDuration = (Math.random() * 2 + 2) + "s";
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 3000);
    }
});
</script>

</body>
</html>
